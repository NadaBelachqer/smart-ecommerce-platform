server.port=8080
spring.application.name=api-gateway

spring.cloud.gateway.routes[0].id=images
spring.cloud.gateway.routes[0].uri=http://product-service:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/uploads/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0


spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=http://product-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# Route pour Auth Service
spring.cloud.gateway.routes[2].id=auth-service
spring.cloud.gateway.routes[2].uri=http://auth-service:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
# Route pour Forecast Service
spring.cloud.gateway.routes[3].id=forecast-service
spring.cloud.gateway.routes[3].uri=http://forecast-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/forecast/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# Route pour Order Service
spring.cloud.gateway.routes[4].id=order-service
spring.cloud.gateway.routes[4].uri=http://order-service:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=0

# Route pour Inventory Service
spring.cloud.gateway.routes[5].id=inventory-service
spring.cloud.gateway.routes[5].uri=http://inventory-service:8083
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

# Route pour Movements (via Inventory Service)
spring.cloud.gateway.routes[6].id=movements-service
spring.cloud.gateway.routes[6].uri=http://inventory-service:8083
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/movements/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=1

# Route pour Alerts (via Inventory Service)
spring.cloud.gateway.routes[7].id=alerts-service
spring.cloud.gateway.routes[7].uri=http://inventory-service:8083
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/alerts/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=1

# Route pour Pricing Service
spring.cloud.gateway.routes[8].id=pricing-service
spring.cloud.gateway.routes[8].uri=http://pricing-service:8087
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/pricing/**
spring.cloud.gateway.routes[8].filters[0]=StripPrefix=1

# Route pour Promotion Service
spring.cloud.gateway.routes[9].id=promotion-service
spring.cloud.gateway.routes[9].uri=http://localhost:8086
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/promotions/**
spring.cloud.gateway.routes[9].filters[0]=StripPrefix=1

