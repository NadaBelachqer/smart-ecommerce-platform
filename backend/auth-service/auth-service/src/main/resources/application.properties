spring.application.name=auth-service

springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

#spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false
spring.datasource.url=jdbc:mysql://mysql-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=${DB_ROOT_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update


server.port=8081

jwt.secret=${JWT_SECRET}  
jwt.expiration=86400000