spring.application.name=auth-service

spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false
spring.datasource.username=root
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Création / mise à jour automatique des tables par Hibernate # update ? met à jour les tables existantes sans les supprimer
spring.jpa.hibernate.ddl-auto=update


# Server port
server.port=8081

# JWT Configuration
jwt.secret=monSecretTresLongPourJWT256Bits123456789012345678
jwt.expiration=86400000