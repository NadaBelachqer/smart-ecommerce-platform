spring.application.name=pricing-service
server.port=8087

# MySQL (Docker)
spring.datasource.url=jdbc:mysql://mysql-pricing:3306/pricing_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# URLs des services (Docker)
product.service.url=http://product-service:8082
inventory.service.url=http://inventory-service:8083

#  ML API URL
ml.api.url=http://ml-api:5000

# SerpAPI
serpapi.key=${SERPAPI_KEY}  
serpapi.enabled=true
pricing.fallback.enabled=true

# Logging
logging.level.org.example.pricingservice=DEBUG
spring.jackson.property-naming-strategy=SNAKE_CASE