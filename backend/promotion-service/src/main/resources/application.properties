spring.application.name=promotion-service
server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/promotion_db?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

ml.promotion.url=http://localhost:5001
services.product.url=http://localhost:8082
services.inventory.url=http://localhost:8083

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.example.promotionservice=DEBUG
logging.level.org.springframework.web.client=DEBUG
