<div class="page-container">

  <div class="page-header">
    <h1>
      {{ isEditMode ? '✏️ Modifier le produit' : '➕ Nouveau produit' }}
    </h1>

    <a routerLink="/products" class="btn-secondary">
      ← Retour
    </a>
  </div>

  <div *ngIf="errorMessage" class="error">
   {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="success">
     {{ successMessage }}
  </div>

<div class="csv-import-box">
  <h3>📥 Importer une liste CSV</h3>

  <input
    type="file"
    #csvInput
    id="csvFileInput"
    accept=".csv"
    (change)="onCsvSelected($event)"
    hidden
  />

  <button
    type="button"
    class="btn-upload"
    (click)="csvInput.click()"
  >
    Choisir fichier CSV
  </button>

  <p *ngIf="selectedCsvFile">
    📄 {{ selectedCsvFile.name }}
  </p>

  <button
    type="button"
    class="btn-upload"
    (click)="importCsv()"
    [disabled]="!selectedCsvFile || loadingCsv"
  >
    {{ loadingCsv ? 'Import en cours...' : 'Importer CSV' }}
  </button>
</div>
  <hr>

  <form
    *ngIf="!loadingPage"
    (ngSubmit)="onSubmit()"
    class="product-form">

    <div class="form-group">
      <label>SKU</label>
      <input type="text" [(ngModel)]="product.sku" name="sku" required />
    </div>

    <div class="form-group">
      <label>Nom</label>
      <input type="text" [(ngModel)]="product.name" name="name" required />
    </div>

    <div class="form-group">
      <label>Catégorie</label>
      <input type="text" [(ngModel)]="product.category" name="category" />
    </div>

    <div class="form-group">
      <label>Prix</label>
      <input type="number" [(ngModel)]="product.sellingPrice" name="price" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea [(ngModel)]="product.description" name="description"></textarea>
    </div>

    <div class="form-group">
  <label>Image du produit</label>

  <input
    type="file"
    #imageInput
    id="imageFileInput"
    accept="image/*"
    (change)="onImageSelected($event)"
    hidden
  />

  <button
    type="button"
    class="btn-upload"
    (click)="imageInput.click()"
  >
    Choisir une image
  </button>

  <p *ngIf="selectedImage">
    🖼️ {{ selectedImage.name }}
  </p>

  <div *ngIf="imagePreview" class="image-preview">
    <img [src]="imagePreview" alt="Aperçu">
    <button type="button" (click)="removeSelectedImage()">✖</button>
  </div>
</div>

    <div class="form-actions">
      <button
        type="submit"
        class="btn-save"
        [disabled]="loadingSubmit"
      >
        {{ loadingSubmit ? 'Enregistrement...' : 'Enregistrer' }}
      </button>

      <a routerLink="/products" class="btn-cancel">
        Annuler
      </a>
    </div>

  </form>
</div>
