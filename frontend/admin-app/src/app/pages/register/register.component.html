<div class="register-container">

  <div class="register-card">

    <div class="header">
      <div class="logo">🧾</div>
      <h1>Create Admin Account</h1>
      <p>eCommerce Platform</p>
    </div>

    <div *ngIf="successMessage" class="success-box">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="form">

      <div class="row">
        <div class="input-group">
          <label>First name</label>
          <input type="text" [(ngModel)]="user.firstName" name="firstName" required>
        </div>

        <div class="input-group">
          <label>Last name</label>
          <input type="text" [(ngModel)]="user.lastName" name="lastName" required>
        </div>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="user.email" name="email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="user.password" name="password" required minlength="6">
      </div>

      <div class="input-group">
        <label>Address</label>
        <input type="text" [(ngModel)]="user.address" name="address">
      </div>

      <div class="input-group">
        <label>Phone</label>
        <input type="tel" [(ngModel)]="user.phone" name="phone">
      </div>

      <div *ngIf="errorMessage" class="error-box">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>

    </form>

    <div class="footer">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </div>

  </div>

</div>
