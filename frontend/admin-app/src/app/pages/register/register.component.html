<div class="register-container">
  <div class="register-card">
    <div class="logo">
      <h1>📝 Créer un compte Admin</h1>
      <p>Plateforme E-Commerce</p>
    </div>
    
    <div *ngIf="successMessage" class="success-message">
      ✅ {{ successMessage }}
    </div>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" [(ngModel)]="user.firstName" name="firstName" required>
        </div>
        <div class="form-group">
          <label>Nom</label>
          <input type="text" [(ngModel)]="user.lastName" name="lastName" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="user.email" name="email" required>
      </div>
      
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="user.password" name="password" required minlength="6">
      </div>
      
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" [(ngModel)]="user.address" name="address">
      </div>
      
      <div class="form-group">
        <label>Téléphone</label>
        <input type="tel" [(ngModel)]="user.phone" name="phone">
      </div>
      
      <div *ngIf="errorMessage" class="error-message">
        ⚠️ {{ errorMessage }}
      </div>
      
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Inscription...' : 'Créer un compte' }}
      </button>
    </form>
    
    <p class="login-link">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </p>
  </div>
</div>
