<div class="register-page">
  <div class="register-card">
    <!-- Logo avec image -->
    <div class="logo-container">
      <img src="assets/images/logo.png" alt="MyMarket" class="register-logo">
    </div>

    <!-- Header -->
    <div class="card-header">
      <h2>Créer un compte</h2>
      <p>Rejoignez la plateforme d'optimisation e-commerce</p>
    </div>

    <!-- Message de succès -->
    <div *ngIf="successMessage" class="success-alert">
      <i class="fas fa-check-circle"></i>
      <span>{{ successMessage }}</span>
    </div>

    <!-- Formulaire -->
    <form (ngSubmit)="onSubmit()" class="register-form">
      <!-- Ligne Prénom & Nom -->
      <div class="form-row">
        <div class="input-group">
          <label>
            <i class="fas fa-user"></i>
            <span>Prénom</span>
          </label>
          <input 
            type="text" 
            [(ngModel)]="user.firstName" 
            name="firstName"
            placeholder="Votre prénom"
            required>
        </div>

        <div class="input-group">
          <label>
            <i class="fas fa-user"></i>
            <span>Nom</span>
          </label>
          <input 
            type="text" 
            [(ngModel)]="user.lastName" 
            name="lastName"
            placeholder="Votre nom"
            required>
        </div>
      </div>

      <!-- Email -->
      <div class="input-group">
        <label>
          <i class="fas fa-envelope"></i>
          <span>Email professionnel</span>
        </label>
        <input 
          type="email" 
          [(ngModel)]="user.email" 
          name="email"
          placeholder="exemple@entreprise.com"
          required
          autocomplete="email">
      </div>

      <!-- Mot de passe -->
      <div class="input-group">
        <label>
          <i class="fas fa-lock"></i>
          <span>Mot de passe</span>
        </label>
        <div class="password-wrapper">
          <input 
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="user.password" 
            name="password"
            placeholder="Min. 6 caractères"
            required
            minlength="6">
          <button type="button" class="toggle-btn" (click)="togglePassword()">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Adresse -->
      <div class="input-group">
        <label>
          <i class="fas fa-map-marker-alt"></i>
          <span>Adresse</span>
        </label>
        <input 
          type="text" 
          [(ngModel)]="user.address" 
          name="address"
          placeholder="Adresse de livraison">
      </div>

      <!-- Téléphone -->
      <div class="input-group">
        <label>
          <i class="fas fa-phone"></i>
          <span>Téléphone</span>
        </label>
        <input 
          type="tel" 
          [(ngModel)]="user.phone" 
          name="phone"
          placeholder="+212 6 XX XX XX XX">
      </div>

      <!-- Message d'erreur -->
      <div *ngIf="errorMessage" class="error-alert">
        <i class="fas fa-exclamation-circle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Bouton création -->
      <button type="submit" [disabled]="loading" class="btn-register">
        <span *ngIf="!loading">
          <i class="fas fa-user-plus"></i> Créer un compte
        </span>
        <span *ngIf="loading">
          <i class="fas fa-spinner fa-pulse"></i> Création en cours...
        </span>
      </button>

      <!-- Lien connexion -->
      <div class="login-section">
        <span>Vous avez déjà un compte ?</span>
        <a routerLink="/login">Se connecter</a>
      </div>
    </form>

    <!-- Footer -->
    <div class="card-footer">
      <div class="footer-links">
        <a href="#">Conditions d'utilisation</a>
        <span class="separator">•</span>
        <a href="#">Confidentialité</a>
        <span class="separator">•</span>
        <a href="#">Support</a>
      </div>
    </div>
  </div>
</div>
