<div class="admin-workspace">
  <!-- Sidebar fixe - Style du premier layout -->
  <aside class="app-sidebar" [class.is-collapsed]="isSidebarCollapsed">
    
    <div class="sidebar-brand">
      <div class="brand-identity">
        <div class="brand-icon-wrapper">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <span class="brand-name" *ngIf="!isSidebarCollapsed">OptiCore <span class="text-accent">Retail</span></span>
      </div>
      <button class="sidebar-toggle-trigger" (click)="toggleSidebar()" title="Réduire le menu">
        <i class="fa-solid" [class.fa-chevron-left]="!isSidebarCollapsed" [class.fa-chevron-right]="isSidebarCollapsed"></i>
      </button>
    </div>

    <div class="navigation-container">
      
      <!-- Groupe Pilotage Central -->
      <nav class="sidebar-navigation-group">
        <div class="nav-section-title" *ngIf="!isSidebarCollapsed">Pilotage Central</div>
        
        <a routerLink="/dashboard" routerLinkActive="is-active" class="navigation-link">
          <i class="fa-solid fa-chart-pie"></i>
          <span class="link-label" *ngIf="!isSidebarCollapsed">Tableau de bord</span>
        </a>
        
        <a routerLink="/products" routerLinkActive="is-active" class="navigation-link">
          <i class="fa-solid fa-boxes-stacked"></i>
          <span class="link-label" *ngIf="!isSidebarCollapsed">Catalogue Articles</span>
        </a>

        <a routerLink="/inventory" routerLinkActive="is-active" class="navigation-link">
          <i class="fa-solid fa-cubes"></i>
          <span class="link-label" *ngIf="!isSidebarCollapsed">Gestion de Stock</span>
        </a>
        
        <a routerLink="/orders" routerLinkActive="is-active" class="navigation-link">
          <i class="fa-solid fa-receipt"></i>
          <span class="link-label" *ngIf="!isSidebarCollapsed">Commandes & Flux</span>
        </a>
      </nav>

      <!-- Groupe Optimisation & IA -->
      <nav class="sidebar-navigation-group">
        <div class="nav-section-title" *ngIf="!isSidebarCollapsed">Optimisation & IA</div>
        
        <a routerLink="/forecast" routerLinkActive="is-active" class="navigation-link">
          <i class="fa-solid fa-timeline"></i>
          <span class="link-label" *ngIf="!isSidebarCollapsed">Prévisions de Vente</span>
        </a>
        
        
        
      </nav>
    </div>

    <div class="sidebar-system-footer">
      <a href="#" class="navigation-link is-disabled" (click)="comingSoon($event)">
        <i class="fa-solid fa-sliders"></i>
        <span class="link-label" *ngIf="!isSidebarCollapsed">Paramètres</span>
      </a>
      <button (click)="logout()" class="navigation-link btn-logout-action">
        <i class="fa-solid fa-arrow-left-from-bracket"></i>
        <span class="link-label" *ngIf="!isSidebarCollapsed">Déconnexion</span>
      </button>
    </div>
  </aside>

  <div class="workspace-container">
    
    <!-- Header - Style du premier layout mais avec les éléments du second -->
    <header class="workspace-top-bar">
      <div class="top-bar-left">
        <div class="page-context">
          <h1 class="current-view-title">{{ pageTitle }}</h1>
          <span class="current-date-badge">{{ currentDate | date:'EEEE d MMMM yyyy' }}</span>
        </div>
        
        <div class="global-search-bar">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" placeholder="Rechercher un produit, un SKU, une commande...">
        </div>
      </div>

      <div class="top-bar-right">
        <div class="scope-selector">
          <i class="fa-solid fa-shop text-muted"></i>
          <span class="scope-name">Tous les Magasins</span>
          <i class="fa-solid fa-chevron-down scope-arrow"></i>
        </div>
        
        <div class="action-notification-bell">
          <i class="fa-regular fa-bell"></i>
          <span class="badge-count-alert">3</span>
        </div>
        
        <div class="admin-profile-trigger">
          <img [src]="'https://ui-avatars.com/api/?name=' + adminName + '&background=004f9f&color=fff&bold=true'" alt="Avatar">
          <div class="profile-meta">
            <span class="profile-name">{{ adminName }}</span>
            <span class="profile-role">Administrateur</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Zone dynamique pour le contenu des pages -->
    <main class="workspace-view">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
