<div class="container">
  <a routerLink="/" class="back-link">← Back to products</a>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
  </div>

  <div *ngIf="errorMessage" class="error-state">
    <span class="error-icon">⚠️</span>
    <p>{{ errorMessage }}</p>
  </div>

  <div *ngIf="!loading && !errorMessage && product" class="product-detail">
    <div class="product-gallery">
      <div class="main-image">
        <img 
          [src]="getImageUrl()" 
          [alt]="product.name"
          (error)="$event.target.src='https://placehold.co/600x600?text=Image+coming+soon'">
      </div>
    </div>
    
    <div class="product-details">
      <h1 class="product-name">{{ product.name }}</h1>
      
      <div class="product-price">
        <span class="price-amount">{{ product.sellingPrice }} DH </span>
        <span class="price-unit" *ngIf="product.category">per {{ product.category.toLowerCase() }}</span>
      </div>
      
      <div class="product-meta">
        <div class="meta-item" *ngIf="product.category">
          <span class="meta-label">Category:</span>
          <span class="meta-value">{{ product.category }}</span>
        </div>
        <div class="meta-item" *ngIf="product.sku">
          <span class="meta-label">SKU:</span>
          <span class="meta-value">{{ product.sku }}</span>
        </div>
      </div>
      
      <div class="stock-status">
        <span class="stock-badge in-stock">✓ in stock</span>
      </div>
      
      <div class="product-description">
        <h3>Description</h3>
        <p>{{ product.description || 'No description available for this product.' }}</p>
      </div>
      
      <button class="add-to-cart-btn">
        🛒 Add to Cart
      </button>
    </div>
  </div>
</div>
