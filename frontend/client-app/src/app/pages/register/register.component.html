<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <!-- Logo avec image -->
      <div class="logo-container">
        <img src="assets/images/logo.png" alt="MyMarket" class="auth-logo">
      </div>
      <h2>Créer un compte</h2>
      <p>Rejoignez MonShop dès aujourd'hui</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="input-row">
        <div class="input-group">
          <label>Prénom</label>
          <input type="text" [(ngModel)]="user.firstName" name="firstName" placeholder="Prénom" required>
        </div>
        <div class="input-group">
          <label>Nom</label>
          <input type="text" [(ngModel)]="user.lastName" name="lastName" placeholder="Nom" required>
        </div>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="user.email" name="email" placeholder="user@example.com" required>
      </div>

      <div class="input-group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="user.password" name="password" placeholder="••••••••" required>
      </div>

      <div class="input-group">
        <label>Adresse</label>
        <input type="text" [(ngModel)]="user.address" name="address" placeholder="Votre adresse">
      </div>

      <div class="input-group">
        <label>Téléphone</label>
        <input type="text" [(ngModel)]="user.phone" name="phone" placeholder="+212 6XX XXX XXX">
      </div>

      <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Inscription...' : 'S\'inscrire' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>Déjà un compte ?</span>
      <a routerLink="/login">Se connecter</a>
    </div>
  </div>
</div>
